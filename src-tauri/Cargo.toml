[package]
name = "cutout"
version = "0.1.0"
description = "Free, offline background removal for your images. Part of KreoKit."
authors = ["KreoKit contributors"]
license = "MIT OR Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cutout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
ureq = "3"
# Pinned: ort 2.0.0-rc.10 (ONNX Runtime 1.22.0, statically linked) is the last release with a
# prebuilt library for Intel Macs, and it runs on macOS 12. rc.11+ dropped x86_64-apple-darwin.
# Upgrade path and details: CLAUDE.md ("Inference"). Re-test macOS 12 and cpu.rs after upgrading.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "download-binaries"] }
ndarray = "0.16"
rayon = "1"
sha2 = "0.11.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Decoding photos in an unoptimised debug build takes seconds; optimise the image crates.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
